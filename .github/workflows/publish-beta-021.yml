name: Withdraw superseded MusicSceneMaker beta installers

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-beta-021.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  withdraw-five-old-exes:
    if: github.repository == 'MSM-App/MusicSceneMaker-App'
    runs-on: ubuntu-latest
    steps:
      - name: Remove only the five published beta EXE attachments
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: MSM-App/MusicSceneMaker-App
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r tag asset; do
            [ -n "$tag" ] || continue
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq -- "$asset"; then
              echo "Withdrawing $tag / $asset"
              gh release delete-asset "$tag" "$asset" --yes
            else
              echo "Already absent: $tag / $asset"
            fi
          done <<'END_ASSETS'
          v0.2.0-beta.1|MusicSceneMaker_0.2.0-beta.1_x64-setup.exe
          v0.2.1-beta.1|MusicSceneMaker_0.2.1-beta.1_x64-setup.exe
          v0.2.1-beta.2|MusicSceneMaker_0.2.1-beta.2_x64-setup.exe
          v0.2.2-beta.1|MusicSceneMaker_0.2.2-beta.1_x64-setup.exe
          v0.2.3-beta.1|MusicSceneMaker_0.2.3-beta.1_x64-setup.exe
          END_ASSETS
          while IFS='|' read -r tag asset; do
            [ -n "$tag" ] || continue
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq -- "$asset"; then
              echo "::error::Asset was not withdrawn: $tag / $asset"
              exit 1
            fi
          done <<'END_VERIFY'
          v0.2.0-beta.1|MusicSceneMaker_0.2.0-beta.1_x64-setup.exe
          v0.2.1-beta.1|MusicSceneMaker_0.2.1-beta.1_x64-setup.exe
          v0.2.1-beta.2|MusicSceneMaker_0.2.1-beta.2_x64-setup.exe
          v0.2.2-beta.1|MusicSceneMaker_0.2.2-beta.1_x64-setup.exe
          v0.2.3-beta.1|MusicSceneMaker_0.2.3-beta.1_x64-setup.exe
          END_VERIFY
          echo "All five old installers withdrawn; release pages and tags were preserved."
